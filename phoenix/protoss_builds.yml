# PhoenixBot opening builds, executed by the ares build runner.
# After the opening completes, macro controllers in bot/main.py take over.
# Docs: https://aressc2.github.io/ares-sc2/tutorials/build_runner.html

UseData: True
BuildSelection: WinrateBased
MinGamesWinrateBased: 3

BuildChoices:
    # active when Debug: True in config.yml
    test_123:
        BotName: Test
        Cycle:
            - SafeExpand
            - GateExpand

    # GateExpand is intentionally NOT in the Protoss cycle. Its nexus goes down
    # at supply 20 (~2:30) -- inside our all-in detection gap (the one-base
    # all-in read is floored at 3:30, and the early-aggression trigger only
    # fires once the enemy's ball approaches ~4:00). Against a one-base stalker
    # all-in (e.g. OneBaseStalkerBot) that early expansion is fatal: replay of
    # the 2026-07-24 ladder loss showed us expanding at 2:30 and reaching ~1
    # stalker by 5:00 while the enemy had 700 army at 4:00. SafeExpand's nexus
    # is at supply 27 (~4:30), which the emergency abort catches first -- so it
    # holds the all-in (verified 2-0 in sparring) AND still macros to 5 bases vs
    # a non-all-in (verified 2-0 vs macro Zerg). GateExpand stays available for
    # the T/Z/Random cycles below, where that PvP timing gap doesn't apply.
    Protoss:
        BotName: ProtossRace
        Cycle:
            - SafeExpand
            - OneBaseDefense

    Random:
        BotName: RandomRace
        Cycle:
            - SafeExpand
            - GateExpand

    Terran:
        BotName: TerranRace
        Cycle:
            - SafeExpand
            - GateExpand

    Zerg:
        BotName: ZergRace
        Cycle:
            - SafeExpand
            - GateExpand

Builds:
    # units-first opening for rush-prone opponents: two gates and zealots
    # before the expansion
    SafeExpand:
        ConstantWorkerProductionTill: 44
        OpeningBuildOrder:
            # full ramp wall (pylon+gateway+core) - ling floods bounce off it
            - 14 pylon @ ramp
            - 15 gateway @ ramp
            - 15 worker_scout
            - 16 gas
            - 19 core @ ramp
            - 19 zealot
            - 22 pylon
            - 22 gateway
            - 23 zealot
            - 27 expand
            - 27 gas

    GateExpand:
        ConstantWorkerProductionTill: 44
        OpeningBuildOrder:
            - 14 pylon @ ramp
            - 15 gateway
            - 15 worker_scout
            - 16 gas
            - 17 gas
            - 19 core
            - 20 expand
            - 20 pylon
            - 21 chrono @ nexus
            - 22 gate
            - 23 gate

    # anti-all-in: ONE base, no expansion, 4 gateways + 2 gas + cyber behind a
    # full ramp wall, workers cut to ~20 so minerals pour into stalkers. Ends
    # ~3:30 with a 4-gate stalker base; bot/main.py holds this posture (no
    # expand/tech, pump stalkers + batteries) until ~7:30. Deployed by the
    # WinrateBased selector against the one-base all-in opponents (OneBase-
    # StalkerBot etc.) that beat the economic openings 0-4 in sparring.
    OneBaseDefense:
        ConstantWorkerProductionTill: 20
        OpeningBuildOrder:
            - 14 pylon @ ramp
            - 15 gateway @ ramp
            - 15 worker_scout
            - 16 gas
            - 17 gas
            - 18 core @ ramp
            - 20 pylon
            - 21 gateway
            - 22 gateway
            - 23 gateway
